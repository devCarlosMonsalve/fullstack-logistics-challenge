<section
  class="content-state"
  [class.error-state]="kind() === 'error'"
  [attr.role]="kind() === 'error' ? 'alert' : 'status'"
  [attr.aria-live]="kind() === 'loading' ? 'polite' : null"
>
  @if (kind() === 'loading') {
    <mat-spinner diameter="40" aria-hidden="true" />
  } @else {
    <mat-icon class="state-icon" aria-hidden="true">{{ displayIcon() }}</mat-icon>
  }

  <h2>{{ displayTitle() }}</h2>
  @if (message()) {
    <p>{{ message() }}</p>
  }
  <div class="state-actions">
    <ng-content />
  </div>
</section>
